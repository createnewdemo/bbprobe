 'not-json'
];

  try{ var r=b.sensorsdata_call_app(p); res['call'+i]=(''+r).substr(0,120); log('call'+i+' -> '+(''+r).substr(0,120)); }
  catch(e){ res['call'+i]='ERR '+e; log('call'+i+' ERR '+e) }
